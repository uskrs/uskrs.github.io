        /* WOBBLE ANIMACIJA */
        @keyframes wobble {
            0% { transform: rotate(0deg); }
            25% { transform: rotate(20deg); }
            50% { transform: rotate(-20deg); }
            75% { transform: rotate(18deg); }
            100% { transform: rotate(0deg); }
        }

        @keyframes fadeOut {
